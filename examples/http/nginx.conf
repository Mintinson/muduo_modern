#user nobody;

worker_processes 4;

events {
    worker_connections 10240;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    
    keepalive_timeout 65;

    server {
        listen 8000;
        server_name localhost;

        location / {
            root html;
            index index.html index.htm;
        }

        location /hello {
            default_type text/plain;
            return 200 "Hello, World!\n";
        }
    }
}